name: Threads Auto Post

on:
  schedule:
    # 日本時間 (JST) から9時間を引いた UTC（協定世界時）で設定しています
    - cron: '0 22 * * *'  # 日本時間 07:00 (UTC 22:00 前日)
    - cron: '0 0 * * *'   # 日本時間 09:00 (UTC 00:00)
    - cron: '0 3 * * *'   # 日本時間 12:00 (UTC 03:00)
    - cron: '0 10 * * *'  # 日本時間 19:00 (UTC 10:00)
    - cron: '0 13 * * *'  # 日本時間 22:00 (UTC 13:00)
  workflow_dispatch: # 手動実行用ボタン

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v3
      - name: Pythonをセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt
      - name: 自動投稿を実行
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python post.py
